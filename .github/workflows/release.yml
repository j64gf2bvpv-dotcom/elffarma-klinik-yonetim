name: Kurulum Paketi Üret ve Yayınla

# Bu iş akışı, elffarma-klinik-yonetim'in Windows Setup.exe (NSIS) ve macOS .dmg
# kurulum paketlerini gerçek Windows/macOS runner'larında derler — Windows tarafı
# geliştirme makinesinde (macOS, wine kurulu değil) yerel olarak üretilemediği için
# bu iş akışı asıl dağıtım yolu budur. Release, `create-release` job'unda TASLAK
# (draft) olarak önceden oluşturulur (electron-builder'ın asset-yükleme yarışını
# önlemek için — bkz. o job'un yorumu), Windows/macOS derlemeleri asset'lerini
# yükler, ikisi de başarıyla biterse `publish-release` job'u taslağı kaldırıp
# GERÇEK yayına alır — hiçbir elle "Publish release" adımı yok. CI bitip release
# yayına alınınca internet bağlantısı olan her kurulu uygulama electron-updater ile
# birkaç dakika içinde otomatik günceller. Bu yüzden SADECE gerçekten dağıtmak
# istediğiniz bir sürüm için `git tag vX.Y.Z && git push origin vX.Y.Z` yapın;
# rutin commit'ler (tag'siz) hiçbir kurulu uygulamayı tetiklemez.
#
# Gerekli repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL            — Supabase Project URL
#   VITE_SUPABASE_ANON_KEY       — Supabase anon public key
#   CSC_LINK                     — Developer ID Application sertifikası + özel anahtarı, base64 .p12
#   CSC_KEY_PASSWORD             — o .p12 dosyasının şifresi
#   APPLE_ID                     — notarization için Apple ID e-postası
#   APPLE_APP_SPECIFIC_PASSWORD  — appleid.apple.com'dan alınan uygulamaya özgü şifre (normal hesap şifresi DEĞİL)
#   APPLE_TEAM_ID                — Apple Developer Team ID (2026-08-13'te eklendi: Q5D5482ZFC)
# (GITHUB_TOKEN, publish için GitHub Actions tarafından otomatik sağlanır.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # electron-builder'ın GitHub publisher'ı, hedef release henüz yoksa "release yok
  # → oluştur" kontrolünü HER asset yüklemesinden önce ayrı ayrı yapıyor. Windows
  # ve macOS job'ları paralel çalıştığı gibi, tek bir job içinde bile birden fazla
  # dosya (ör. .exe ve .exe.blockmap) paralel yüklenirken aynı anda "release yok"
  # görüp ikisi de oluşturmayı deniyor — biri 422 already_exists ile patlıyor ve
  # tüm job'u (dolayısıyla o platformun asset'lerini) düşürüyor (bkz. v2.17.82).
  # Bu job release'i matrix başlamadan ÖNCE tek seferde oluşturarak yarışı kökten
  # kaldırıyor: electron-builder artık her zaman "release var" durumunu bulup asset
  # yüklemekten başka bir şey yapmıyor.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Taslak (draft) olarak oluşturuluyor — electron-updater draft release'leri
      # "en son sürüm" olarak görmez, bu yüzden derleme süren birkaç dakika boyunca
      # kurulu uygulamalar boş/eksik bir release'e karşı "güncelleme kontrol
      # edilemedi" hatası almaz (v2.17.84'te gerçekleşti: release asset'siz
      # yayınlanmış haldeyken her açılışta 404 hatası veriyordu). Aşağıdaki
      # publish-release job'u, HER İKİ platform derlemesi de asset'lerini
      # yükleyip başarıyla bitince taslağı kaldırıp gerçek yayına alıyor.
      - name: GitHub Release'i taslak olarak önceden oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG zaten var, atlanıyor."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft --generate-notes
          fi

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_args: --win nsis --x64
          - os: macos-latest
            build_args: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kurulum paketini derle, imzala/notarize et ve GitHub Release'e yükle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLINIC_NAME: Elffarma
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package -- ${{ matrix.build_args }} --publish always

  # Sadece create-release gerçekten çalışıp taslak oluşturduysa (tag push'unda) VE
  # iki platformun derlemesi de başarıyla bitip asset'lerini yüklediyse taslağı
  # kaldırıp gerçek yayına alır. Bir platform başarısız olursa release taslakta
  # kalır — hiçbir kurulu uygulama eksik/bozuk bir sürümü asla görmez.
  publish-release:
    needs: [create-release, build]
    if: always() && needs.create-release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release'i yayına al
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
