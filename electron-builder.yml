appId: com.elffarma.paketprogrami
productName: Elffarma Paket Programı
copyright: Copyright © Elffarma
directories:
  output: release
  buildResources: build
# Açıkça sabitlenmedikçe, auto-update besleme dosyasının (latest.yml/latest-mac.yml)
# referans verdiği dosya adıyla gerçekten üretilen installer'ın adı electron-builder'da
# farklılaşabiliyor (biri package.json "name"ini, diğeri "productName"i kullanabiliyor) —
# bu da GitHub Release'e yüklenince auto-update'in dosyayı bulamayıp sessizce
# başarısız olmasına yol açar. Tek bir şablonu her ikisi için de zorunlu kılıyoruz.
artifactName: ElffarmaPaketProgrami-${version}-${arch}.${ext}
files:
  - dist/**
  - dist-electron/**
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
protocols:
  name: Elffarma Paket Programı Şifre Sıfırlama
  schemes:
    - elffarmapaket
# Otomatik güncelleme (electron-updater) bu depodaki GitHub Releases'i kaynak olarak
# kullanır. Kullanıcı isteği üzerine `releaseType: release` ile TASLAK ADIMSIZ,
# doğrudan yayınlanıyor — CI bir `vX.Y.Z` etiketi (tag) push'landığında Windows/macOS
# installer'larını derleyip GitHub Release'e yükler yüklemez kurulu tüm uygulamalar
# bir sonraki açılışta otomatik güncellenir, elle "Publish release" adımı gerekmez.
# (Önceki "draft" varsayılanı yanlışlıkla erken/bozuk bir sürümün otomatik dağıtılmasını
# engelliyordu — bu güvenlik adımı bilerek kaldırıldı, artık dikkat tag push etmekte.)
publish:
  provider: github
  owner: j64gf2bvpv-dotcom
  repo: elffarma-klinik-yonetim
  releaseType: release
mac:
  category: public.app-category.medical
  icon: build/icons/icon.icns
  # 2026-08-13'ten itibaren gerçek bir Apple Developer ID Application sertifikasıyla
  # imzalanıyor (identity artık null değil — CI ortamındaki CSC_LINK/CSC_KEY_PASSWORD
  # secret'larından electron-builder otomatik keşfediyor). hardenedRuntime + entitlements,
  # Apple'ın notarization için zorunlu tuttuğu ayarlar. notarize: true ile electron-builder
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID ortam değişkenlerini kullanıp
  # paketi otomatik Apple'a gönderip onaylatıyor (afterSign adımı olarak, elle bir
  # afterSign hook'una gerek kalmadı — eski ad-hoc imza geçici çözümü kaldırıldı).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # DMG kurulum içindir; ZIP ise Squirrel.Mac'in otomatik güncelleme sırasında
  # indirip uyguladığı asıl paket — sadece dmg üretilirse autoUpdater
  # "ZIP file not provided" hatasıyla güncellemeyi sessizce başarısız kılıyordu
  # (2026-08-12'de gerçek cihazda teşhis edildi, latest-mac.yml zip'e referans
  # veriyor ama zip hiç üretilmiyordu).
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  # Kurulum sırasında pencerede uygulama ikonu + "Uygulamalar" klasörüne sürükle-bırak
  # kısayolu yan yana görünür (macOS'un standart DMG kurulum deneyimi).
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # oneClick: false → tam kurulum sihirbazı (Next → Kurulum Yeri Seç → Install → Finish),
  # tek tıkla sessiz kurulum değil.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Elffarma Paket Programı
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico
linux:
  icon: build/icons/icon.png
  target:
    - AppImage
